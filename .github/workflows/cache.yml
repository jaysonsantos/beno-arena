name: Cache
on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/**
      - .github/workflows/cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the devenv shell on each developer platform and push it to Cachix.
  devenv:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jaysonsantos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix profile install nixpkgs#devenv
      - run: devenv shell -- beni help
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
